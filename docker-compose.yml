services:
  db:
    image: postgres:17-alpine
    container_name: digital-store-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: digital-store-api
    depends_on:
      db:
        condition: service_healthy   # só sobe quando o Postgres aceitar conexões
    environment:
      DB_HOST: db                    # nome do serviço na rede do compose
      DB_PORT: 5432                  # porta interna (não a do host)
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      APP_BASE_URL: ${APP_BASE_URL}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
