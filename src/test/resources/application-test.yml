# Perfil usado pelos testes (@ActiveProfiles("test")). O banco vem do Testcontainers (@ServiceConnection).
app:
  base-url: http://localhost:8080
  upload-dir: ${java.io.tmpdir}/digital-store-test-uploads
  jwt:
    secret: chave-fixa-de-teste-com-mais-de-32-caracteres
    expiration-minutes: 60

spring:
  jpa:
    properties:
      hibernate:
        generate_statistics: true   # permite contar as queries da busca (teste de N+1)

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
